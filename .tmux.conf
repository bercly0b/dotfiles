set -g mouse on
set -g prefix C-n

# 0 is too far from ` ;)
set -g base-index 1

set-option -g status-position top
set-option -g mode-keys vi

# use vim navigation
not_tmux="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?(g?(view|n?vim?x?)(diff)?|fzf)$'"
bind-key -n C-h if-shell "$not_tmux" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$not_tmux" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$not_tmux" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$not_tmux" "send-keys C-l"  "select-pane -R"
bind-key -n 'C-\' if-shell "$not_tmux" 'send-keys C-\\' 'select-pane -l'

# clear command
bind-key -n M-k send-keys C-l \; clear-history

bind-key / copy-mode \; send-key ?

# Use v to trigger selection
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Use y to yank current selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g pane-border-style fg=colour236,bg=colour236
set -g pane-active-border-style fg=colour237,bg=colour237

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Shift arrow to switch windows
bind -n M-h  previous-window
bind -n M-l next-window

set -g @fzf-url-bind 'x'

# port from open-net util
set -g "@open_backend_remote_tunnel_port" 20501

# important! set trueguicolors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# extended keys (CSI u) — чтобы приложения различали Shift+Enter и подобное
# extended-keys-format needs tmux 3.5+, -q keeps older tmux on servers quiet
set -s extended-keys always
set -sq extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Reload tmux config
bind r source-file ~/.tmux.conf

# theme
set -g @plugin 'odedlaz/tmux-onedark-theme'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'wfxr/tmux-fzf-url'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
