set -g prefix C-n
set -g mouse on
set -g mode-keys vi
set -g status-position top
# 0 is too far from ` ;)
set -g base-index 1

set -g default-terminal "tmux-256color"
# Tc = truecolor
set -ga terminal-overrides ",*256col*:Tc"

# CSI u, so apps can tell Shift+Enter from Enter.
# extended-keys-format needs tmux 3.5+, -q keeps older tmux on servers quiet
set -s extended-keys always
set -sq extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

set -g pane-border-style fg=colour236,bg=colour236
set -g pane-active-border-style fg=colour237,bg=colour237

bind r source-file ~/.tmux.conf
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind / copy-mode \; send-keys ?

bind -n M-h previous-window
bind -n M-l next-window
# Ghostty sends M-k on Cmd+K
bind -n M-k send-keys C-l \; clear-history

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# C-h/j/k/l/\ go to vim/fzf when they run in the pane, otherwise switch panes
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?(g?(view|n?vim?x?)(diff)?|fzf)$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'odedlaz/tmux-onedark-theme'
set -g @plugin 'wfxr/tmux-fzf-url'

set -g @fzf-url-bind 'x'
# open-net tunnel port, read by the open script
set -g @open_backend_remote_tunnel_port 20501

# must stay at the very bottom
run -b '~/.tmux/plugins/tpm/tpm'
