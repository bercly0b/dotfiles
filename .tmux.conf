set -g prefix C-n
set -g mouse on
set -g mode-keys vi
set -g status-position top
# 0 is too far from ` ;)
set -g base-index 1

set -g default-terminal "tmux-256color"
# Tc = truecolor
set -ga terminal-overrides ",*256col*:Tc"

# CSI u, so apps can tell Shift+Enter from Enter.
# extended-keys-format needs tmux 3.5+, -q keeps older tmux on servers quiet
set -s extended-keys always
set -sq extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

bind r source-file ~/.tmux.conf
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind / copy-mode \; send-keys ?

bind -n M-h previous-window
bind -n M-l next-window
# Ghostty sends M-k on Cmd+K
bind -n M-k send-keys C-l \; clear-history

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# C-h/j/k/l/\ go to vim/fzf when they run in the pane, otherwise switch panes
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?(g?(view|n?vim?x?)(diff)?|fzf)$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'wfxr/tmux-net-speed'
set -g @plugin 'wfxr/tmux-fzf-url'

set -g @fzf-url-bind 'x'
# open-net tunnel port, read by the open script
set -g @open_backend_remote_tunnel_port 20501

set -g @cpu_percentage_format "%2.0f%%"
set -g @ram_percentage_format "%2.0f%%"
# %% because status-right goes through strftime, where %s is the epoch time
set -g @download_speed_format "%%s"
set -g @upload_speed_format "%%s"
# VPN traffic is counted on both utun* and en0, so count only en0
if 'uname | grep -q Darwin' 'set -g @net_speed_interfaces en0'

# Flavor follows the theme line in ghostty/config. The plugin keeps its colours
# across prefix+r, so a flavor switch needs a tmux restart.
if 'grep -q "^theme = Catppuccin Mocha" ~/self/dotfiles/ghostty/config' \
    'set -g @catppuccin_flavor mocha' 'set -g @catppuccin_flavor latte'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_date_time_text " %H:%M"
set -g @catppuccin_host_text " #h"
# loaded before tpm, so the modules exist when status-right is built
run ~/.tmux/plugins/tmux/catppuccin.tmux

# setenv and not %hidden: %hidden runs while the file is parsed, before
# catppuccin.tmux above has run and set its own MODULE_NAME
setenv -gh MODULE_NAME net_speed
set -g @catppuccin_net_speed_icon "󰛳 "
set -gF @catppuccin_net_speed_color "#{E:@thm_teal}"
set -g @catppuccin_net_speed_text " ↓#{l:#{download_speed}} ↑#{l:#{upload_speed}}"
source -q ~/.tmux/plugins/tmux/utils/status_module.conf

set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
# -F puts the #{cpu_percentage}-style placeholders into status-right now,
# tpm then runs tmux-cpu, tmux-battery and net-speed to fill them in
set -g status-right ""
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -agF status-right "#{E:@catppuccin_status_net_speed}"
if 'uname | grep -q Darwin' 'set -agF status-right "#{E:@catppuccin_status_battery}"'
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{E:@catppuccin_status_host}"
# tmux 3.8 underlines the current window by default, older tmux on servers doesn't
set -g window-status-current-style default

# must stay at the very bottom
run -b '~/.tmux/plugins/tpm/tpm'
